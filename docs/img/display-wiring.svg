<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Wiring the CrowPanel display and the charger to the carrier board">
<title>Wiring the CrowPanel display and the charger to the carrier board</title>
<defs><marker id="ah-00a888" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00a888"/></marker><marker id="ah-0aac23" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0aac23"/></marker><marker id="ah-191919" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#191919"/></marker><marker id="ah-257de0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#257de0"/></marker><marker id="ah-666666" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666666"/></marker><marker id="ah-dc3c3d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc3c3d"/></marker><marker id="ah-f47230" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f47230"/></marker></defs>
<rect width="980" height="520" rx="10" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#191919" text-anchor="start">Display and power wiring</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">Four signals and two supply wires. The CrowPanel has no 5 V pin, so the carrier is fed from the charger&#x27;s second port.</text>
<rect x="24" y="96" width="230" height="196" rx="6" fill="#f6f7f8" stroke="#c2c2c2" stroke-width="1.5"/>
<text x="40" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">CrowPanel 7.0&quot;  I2C connector</text>
<text x="40" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">go by the silkscreen labels</text>
<rect x="200" y="157" width="18" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="1.5"/>
<text x="190" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="end">SCL · IO20</text>
<rect x="200" y="191" width="18" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="1.5"/>
<text x="190" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="end">SDA · IO19</text>
<rect x="200" y="225" width="18" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="1.5"/>
<text x="190" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3c3d" text-anchor="end">3V3</text>
<rect x="200" y="259" width="18" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="1.5"/>
<text x="190" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="end">GND</text>
<rect x="24" y="330" width="230" height="120" rx="6" fill="#f6f7f8" stroke="#c2c2c2" stroke-width="1.5"/>
<text x="40" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">Charger port 2</text>
<text x="40" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">USB-A to bare-wire pigtail</text>
<rect x="200" y="391" width="18" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="1.5"/>
<text x="190" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="end">+5 V</text>
<rect x="200" y="421" width="18" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="1.5"/>
<text x="190" y="434" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="end">GND</text>
<text x="40" y="470" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">measure which lead is + with a meter;</text>
<text x="40" y="484" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">pigtail colours are not reliable</text>
<rect x="640" y="96" width="150" height="220" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="715" y="86" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919" text-anchor="middle">J3  (carrier)</text>
<rect x="650" y="112" width="16" height="16" rx="0" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">1</text>
<text x="694" y="124" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">5V in</text>
<rect x="650" y="146" width="16" height="16" rx="2" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">2</text>
<text x="694" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">GND</text>
<rect x="650" y="180" width="16" height="16" rx="2" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">3</text>
<text x="694" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">SDA</text>
<rect x="650" y="214" width="16" height="16" rx="2" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">4</text>
<text x="694" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">SCL</text>
<rect x="650" y="248" width="16" height="16" rx="2" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">5</text>
<text x="694" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">n/c (was DRDY)</text>
<rect x="650" y="282" width="16" height="16" rx="2" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">6</text>
<text x="694" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">n/c</text>
<rect x="640" y="356" width="150" height="84" rx="6" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<text x="715" y="346" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#191919" text-anchor="middle">J5  (carrier)</text>
<rect x="650" y="372" width="16" height="16" rx="0" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">1</text>
<text x="694" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">FOOTSW</text>
<rect x="650" y="406" width="16" height="16" rx="2" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="676" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">2</text>
<text x="694" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">GND</text>
<path d="M218 200 L440 200 L440 188 L638 188" fill="none" stroke="#666666" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="218" cy="200" r="3" fill="#666666" stroke="#666666" stroke-width="0"/>
<path d="M218 166 L470 166 L470 222 L638 222" fill="none" stroke="#666666" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="218" cy="166" r="3" fill="#666666" stroke="#666666" stroke-width="0"/>
<path d="M218 268 L500 268 L500 414 L638 414" fill="none" stroke="#666666" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="218" cy="268" r="3" fill="#666666" stroke="#666666" stroke-width="0"/>
<path d="M218 400 L560 400 L560 120 L638 120" fill="none" stroke="#191919" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="218" cy="400" r="3" fill="#191919" stroke="#191919" stroke-width="0"/>
<path d="M218 430 L590 430 L590 154 L638 154" fill="none" stroke="#191919" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="218" cy="430" r="3" fill="#191919" stroke="#191919" stroke-width="0"/>
<path d="M218 234 L278 234" fill="none" stroke="#dc3c3d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 225 L288 243" fill="none" stroke="#dc3c3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 243 L288 225" fill="none" stroke="#dc3c3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3c3d" text-anchor="start">cut back + insulate</text>
<text x="300" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#dc3c3d" text-anchor="start">never to J3 pin 1</text>
<rect x="24" y="498" width="0" height="0" rx="6" fill="#ffffff" stroke="#c2c2c2" stroke-width="1.5"/>
<text x="270" y="500" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">Why the 3V3 wire matters: J3 pin 1 is a 5 V input with no blocking diode. Tied to the display&#x27;s 3.3 V rail it back-feeds</text>
<text x="270" y="514" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">5 V into the ESP32-S3 (3.6 V max). If a footswitch occupies J5, land the I²C ground on J4 pin 2 instead.</text>
</svg>
