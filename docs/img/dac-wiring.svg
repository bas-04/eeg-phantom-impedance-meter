<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Hand-wiring the MCP4725 DAC module to the M1 socket">
<title>Hand-wiring the MCP4725 DAC module to the M1 socket</title>
<defs><marker id="ah-00a888" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00a888"/></marker><marker id="ah-0aac23" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0aac23"/></marker><marker id="ah-191919" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#191919"/></marker><marker id="ah-257de0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#257de0"/></marker><marker id="ah-666666" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666666"/></marker><marker id="ah-dc3c3d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc3c3d"/></marker><marker id="ah-f47230" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f47230"/></marker></defs>
<rect width="900" height="470" rx="10" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#191919" text-anchor="start">M1: wire the DAC by label, don&#x27;t plug it in</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">The Rev B footprint swaps the module&#x27;s last two pins (A0 and VOUT). Plugged straight in, VOUT lands on hole 6, which goes nowhere.</text>
<rect x="40" y="86" width="600" height="70" rx="8" fill="#1f3a5f" stroke="#191919" stroke-width="1.5"/>
<text x="340" y="112" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">MCP4725 module (pin order varies by maker: read the labels)</text>
<text x="90" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">VCC / VDD</text>
<circle cx="90" cy="172" r="6" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<path d="M90 156 L90 166" fill="none" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="190" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>
<circle cx="190" cy="172" r="6" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<path d="M190 156 L190 166" fill="none" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="290" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">SCL</text>
<circle cx="290" cy="172" r="6" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<path d="M290 156 L290 166" fill="none" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="390" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">SDA</text>
<circle cx="390" cy="172" r="6" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<path d="M390 156 L390 166" fill="none" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">OUT / VOUT</text>
<circle cx="490" cy="172" r="6" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<path d="M490 156 L490 166" fill="none" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="590" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">A0 (if fitted)</text>
<circle cx="590" cy="172" r="6" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<path d="M590 156 L590 166" fill="none" stroke="#191919" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="330" width="600" height="80" rx="8" fill="#f6f7f8" stroke="#191919" stroke-width="1.5"/>
<rect x="83" y="323" width="14" height="14" rx="0" fill="#d4a72c" stroke="#191919" stroke-width="1"/>
<text x="90" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#191919" text-anchor="middle">1</text>
<text x="90" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#257de0" text-anchor="middle">+3.3 V</text>
<circle cx="190" cy="330" r="7" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<text x="190" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#191919" text-anchor="middle">2</text>
<text x="190" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#257de0" text-anchor="middle">GND</text>
<circle cx="290" cy="330" r="7" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<text x="290" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#191919" text-anchor="middle">3</text>
<text x="290" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#257de0" text-anchor="middle">SCL</text>
<circle cx="390" cy="330" r="7" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<text x="390" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#191919" text-anchor="middle">4</text>
<text x="390" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#257de0" text-anchor="middle">SDA</text>
<circle cx="490" cy="330" r="7" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<text x="490" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#191919" text-anchor="middle">5</text>
<text x="490" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#257de0" text-anchor="middle">DAC_OUT</text>
<circle cx="590" cy="330" r="7" fill="#d4a72c" stroke="#d4a72c" stroke-width="0"/>
<text x="590" y="362" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#191919" text-anchor="middle">6</text>
<text x="590" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="middle">unused</text>
<text x="340" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#666666" text-anchor="middle">M1 socket on the carrier (hole 1 = square pad)</text>
<path d="M90 178 L90 318" fill="none" stroke="#00a888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-00a888)"/>
<path d="M190 178 L190 318" fill="none" stroke="#00a888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-00a888)"/>
<path d="M290 178 L290 318" fill="none" stroke="#00a888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-00a888)"/>
<path d="M390 178 L390 318" fill="none" stroke="#00a888" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-00a888)"/>
<path d="M490 178 L490 318" fill="none" stroke="#f47230" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-f47230)"/>
<text x="498" y="250" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#f47230" text-anchor="start">OUT → hole 5</text>
<path d="M590 178 L590 250" fill="none" stroke="#666666" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 250 L590 258" fill="none" stroke="#666666" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M576 258 L604 258" fill="none" stroke="#666666" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M581 262 L599 262" fill="none" stroke="#666666" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M586 266 L594 266" fill="none" stroke="#666666" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="608" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#666666" text-anchor="start">A0 → GND</text>
<text x="608" y="280" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">hole 6</text>
<text x="608" y="294" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">stays empty</text>
<text x="720" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">Check with a meter,</text>
<text x="720" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#191919" text-anchor="start">powered:</text>
<text x="720" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">module VCC must read</text>
<text x="720" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">3.3 V. About 2.2 V means</text>
<text x="720" y="170" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">the power wire is open</text>
<text x="720" y="185" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">and the chip is running</text>
<text x="720" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">off SDA/SCL. It still</text>
<text x="720" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">answers on the bus.</text>
<text x="720" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start"></text>
<text x="720" y="245" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">Address: 0x60 (generic)</text>
<text x="720" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">or 0x62 (Adafruit, A0</text>
<text x="720" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">to GND). The firmware</text>
<text x="720" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#666666" text-anchor="start">searches 0x60–0x63.</text>
</svg>
