<rect width="1030" height="590" rx="10" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#191919" text-anchor="start">Three measurements from one switch fabric</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">Each insert is isolated in plastic, so current can only cross from the phantom to the cap through gel. Where it is allowed back decides what is measured.</text>
