<text x="170" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="middle">22 conductive-PLA inserts at the</text>
<text x="170" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="middle">10-20 sites, in a printed PLA shell</text>
