<text x="476" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">160 × 116 mm, all through-hole</text>
<text x="480" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="start">6× CD74HC4067 analog mux</text>
<text x="492" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">drive · sense · return banks</text>
<text x="480" y="264" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="start">2× SN74HC4066 mode switches</text>
<text x="480" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="start">2× MCP6004 op-amps</text>
<text x="492" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">current pump, TIA, sense amp</text>
<text x="480" y="321" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="start">MCP4725 DAC, 2× ADS1115 ADC</text>
<text x="480" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="start">2× MCP23017 I/O expanders</text>
<text x="480" y="359" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#191919" text-anchor="start">R20–R22 0.1 % cal standards</text>
