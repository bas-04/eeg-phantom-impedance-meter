<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#191919" text-anchor="start">Inside the carrier board</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">One site at a time: a known AC current is pushed out through the phantom insert and back through the cap electrode,</text>
<text x="24" y="74" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">while the voltage across that loop is read at the connector pin itself.</text>
